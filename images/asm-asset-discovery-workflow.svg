<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Authorized attack surface inventory workflow</title>
  <desc id="desc">An authorized scope and CMDB feed discovery, verification, infrastructure classification, scoped validation, and an owned asset inventory.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#61afef"/>
    </marker>
    <style>
      .bg{fill:#202326}.card{fill:#272b2f;stroke:#42484e;stroke-width:2}.accent{fill:#61afef}.green{fill:#98c379}.purple{fill:#c678dd}.yellow{fill:#e5c07b}.text{fill:#e8edf1;font:600 20px 'Segoe UI',Arial,sans-serif}.small{fill:#a6afb8;font:15px 'Segoe UI',Arial,sans-serif}.line{stroke:#61afef;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="440" rx="24"/>
  <text x="48" y="58" class="text" font-size="26">Authorized external asset inventory</text>
  <text x="48" y="88" class="small">A scoped, evidence-led workflow — discovery signals are validated before they become findings.</text>
  <g transform="translate(48 150)">
    <rect class="card" width="165" height="150" rx="16"/>
    <circle cx="82" cy="40" r="18" fill="#61afef" opacity=".18"/><text x="82" y="47" text-anchor="middle" class="accent" font-size="22">01</text>
    <text x="82" y="86" text-anchor="middle" class="text">Scope + CMDB</text><text x="82" y="115" text-anchor="middle" class="small">Owners, domains,</text><text x="82" y="136" text-anchor="middle" class="small">and exclusions</text>
  </g>
  <path class="line" d="M218 225h32"/>
  <g transform="translate(260 150)">
    <rect class="card" width="165" height="150" rx="16"/>
    <circle cx="82" cy="40" r="18" fill="#98c379" opacity=".18"/><text x="82" y="47" text-anchor="middle" class="green" font-size="22">02</text>
    <text x="82" y="86" text-anchor="middle" class="text">Discover</text><text x="82" y="115" text-anchor="middle" class="small">Find candidate</text><text x="82" y="136" text-anchor="middle" class="small">hostnames</text>
  </g>
  <path class="line" d="M430 225h32"/>
  <g transform="translate(472 150)">
    <rect class="card" width="165" height="150" rx="16"/>
    <circle cx="82" cy="40" r="18" fill="#e5c07b" opacity=".18"/><text x="82" y="47" text-anchor="middle" class="yellow" font-size="22">03</text>
    <text x="82" y="86" text-anchor="middle" class="text">Verify</text><text x="82" y="115" text-anchor="middle" class="small">Resolve DNS and</text><text x="82" y="136" text-anchor="middle" class="small">confirm web service</text>
  </g>
  <path class="line" d="M642 225h32"/>
  <g transform="translate(684 150)">
    <rect class="card" width="165" height="150" rx="16"/>
    <circle cx="82" cy="40" r="18" fill="#c678dd" opacity=".18"/><text x="82" y="47" text-anchor="middle" class="purple" font-size="22">04</text>
    <text x="82" y="86" text-anchor="middle" class="text">Classify</text><text x="82" y="115" text-anchor="middle" class="small">CDN, cloud, or</text><text x="82" y="136" text-anchor="middle" class="small">direct service</text>
  </g>
  <path class="line" d="M854 225h32"/>
  <g transform="translate(896 150)">
    <rect class="card" width="165" height="150" rx="16"/>
    <circle cx="82" cy="40" r="18" fill="#61afef" opacity=".18"/><text x="82" y="47" text-anchor="middle" class="accent" font-size="22">05</text>
    <text x="82" y="86" text-anchor="middle" class="text">Validate</text><text x="82" y="115" text-anchor="middle" class="small">Approved, limited</text><text x="82" y="136" text-anchor="middle" class="small">service checks</text>
  </g>
  <path class="line" d="M1066 225h32"/>
  <g transform="translate(1102 150)">
    <rect class="card" width="62" height="150" rx="16"/>
    <path d="M1122 55h22M1122 73h22M1122 91h22M1122 109h15" stroke="#98c379" stroke-width="5" stroke-linecap="round"/>
    <text x="1133" y="137" text-anchor="middle" class="small" font-size="12">Inventory</text>
  </g>
  <text x="48" y="365" class="small">Keep the scope explicit. Treat CDN and origin classifications as hypotheses that require owner-approved validation.</text>
</svg>
